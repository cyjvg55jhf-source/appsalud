<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reto 66">
<meta name="theme-color" content="#000000">
<title>Reto 66</title>
<style>
:root{color-scheme:dark;--bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--track:#2c2c2e;--line:#2c2c2e;--nav:#0a0a0a;--tx:#ffffff;--mut:#8e8e93;--ac:#4f8bff;--ac2:#9bbcff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--okbg:#10301b;--r:22px}
[data-theme=claro]{color-scheme:light;--bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--track:#e5e5ea;--line:#e5e5ea;--nav:#ffffff;--tx:#111111;--mut:#6e6e73;--ac:#3b6ef5;--ac2:#8fb0ff;--ok:#2fb857;--warn:#e08600;--bad:#e5384f;--okbg:#e3f6e9;--r:22px}
[data-theme=clasico]{--bg:#0f1020;--card:#1a1b33;--card2:#232547;--track:#232547;--line:#2a2c52;--nav:#14152b;--tx:#eef0ff;--mut:#8d90b8;--ac:#7c5cff;--ac2:#b39dff;--ok:#2ee59d;--warn:#ffb020;--bad:#ff5c7a;--okbg:#12332c;--r:16px}
html{background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
#app{max-width:520px;margin:auto;padding:14px 14px 96px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .4s}
.big{font-size:34px;font-weight:800}
.habit{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px;border:2px solid transparent;width:100%;color:var(--tx);font:inherit;text-align:left}
.habit.done{border-color:var(--ok);background:var(--okbg)}
.habit .ic{font-size:26px}.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:16px}
.done .chk{background:var(--ok);border-color:var(--ok);color:#06241b}
.pill{background:var(--card2);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--mut)}
.grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.grid66 i{aspect-ratio:1;border-radius:4px;background:var(--track)}
.grid66 i.ok{background:var(--ok)}.grid66 i.bad{background:var(--bad)}.grid66 i.today{outline:2px solid var(--ac)}
input,select{background:var(--card2);color:var(--tx);border:0;border-radius:10px;padding:11px;font:inherit;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 4px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.g2>*{min-width:0}
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;min-height:44px;text-align:left;-webkit-appearance:none;appearance:none}
button.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;width:100%;margin-top:8px}
button.b.s{background:var(--card2)}button.b.d{background:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px}nav button b{display:block;font-size:22px}
nav button.on{color:var(--tx)}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calg>i{aspect-ratio:1}.calh{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.calc{aspect-ratio:1;border:0;border-radius:10px;color:var(--tx);font:inherit;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.calc .cn{font-size:12px;font-weight:700}.calc .ci{font-size:11px;min-height:13px;line-height:1}
.calc.tod{outline:2px solid var(--ac)}.calc.sel{outline:2px solid var(--tx)}
.badge{display:inline-block;margin:3px;padding:6px 10px;border-radius:20px;background:var(--card2);font-size:13px}.badge.off{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ok);color:#06241b;padding:10px 16px;border-radius:20px;font-weight:700;z-index:9;max-width:90vw;text-align:center}
svg text{fill:var(--mut);font-size:10px}
.tp{flex:1;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:12px 4px;color:var(--tx);font:inherit;font-size:13px}
.tp.on{border-color:var(--c);background:var(--card2)}.lvb.sel{border-color:var(--c);background:var(--card2)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const KEY='reto66_v1';
const ATTRS=['Nutrición','Fuerza','Resistencia','Mente'];
const WK={
 fuerza:{n:'Fuerza',ic:'🏋️',col:'#ff7a45',at:{Fuerza:1,Resistencia:.25},lv:[
  {n:'Calentamiento',g:'30 min · circuito ligero de cuerpo completo',xp:20,m:'Músculos despiertos 💪'},
  {n:'Forja',g:'45 min · 4 ejercicios básicos, 3×10',xp:40,m:'Estás forjando fuerza 🔨'},
  {n:'Titán',g:'60 min · series pesadas 5×5 + core',xp:70,m:'¡Fuerza de titán! ⚡'},
  {n:'Bestia',g:'75 min · pesado + finisher al fallo',xp:110,m:'¡MODO BESTIA! 🦍'}]},
 correr:{n:'Correr',ic:'🏃',col:'#2ee59d',at:{Resistencia:1},lv:[
  {n:'Trote',g:'20-30 min · ritmo suave, sin mirar el reloj',xp:20,m:'Piernas en marcha 👟'},
  {n:'Ritmo',g:'5 km · ritmo constante y cómodo',xp:40,m:'Ritmo sólido 🎯'},
  {n:'Tempo',g:'8 km · o 30 min a ritmo fuerte',xp:70,m:'Tempo de campeón 🔥'},
  {n:'Maratoniano',g:'12+ km · o series 10×400 m',xp:110,m:'¡Pulmones de acero! 🫁'}]},
 bici:{n:'Bici',ic:'🚴',col:'#5cc8ff',at:{Resistencia:1},lv:[
  {n:'Paseo',g:'45 min · 15-20 km suaves',xp:20,m:'Paseo completado 🌤️'},
  {n:'Ruta',g:'30 km · ritmo constante',xp:40,m:'Ruta en el bolsillo 🛣️'},
  {n:'Puerto',g:'50 km · con desnivel o subidas',xp:70,m:'¡Puerto conquistado! ⛰️'},
  {n:'Gran Fondo',g:'80+ km · o 3 h en bici',xp:110,m:'¡Gran Fondo, leyenda! 🏅'}]},
 senderismo:{n:'Senderismo',ic:'🥾',col:'#a3d65c',at:{Resistencia:.75},lv:[
  {n:'Paseo',g:'hasta 5 km · terreno llano, ritmo tranquilo',xp:20,m:'Aire fresco y buen paseo 🌳'},
  {n:'Sendero',g:'5-10 km · algo de desnivel',xp:40,m:'Sendero completado 🥾'},
  {n:'Montaña',g:'10-15 km · subidas con desnivel',xp:70,m:'¡Montaña a tus pies! ⛰️'},
  {n:'Travesía',g:'15+ km · o más de 5 h de ruta',xp:110,m:'¡Travesía de leyenda! 🧭'}]},
 padel:{n:'Pádel',ic:'🎾',col:'#f0d93a',at:{Resistencia:.6},lv:[
  {n:'Peloteo',g:'45 min · peloteo y práctica de golpes',xp:20,m:'Buen peloteo 🎾'},
  {n:'Partido',g:'60 min · partido amistoso',xp:40,m:'Partido ganado en actitud 🤝'},
  {n:'Competición',g:'90 min · partido intenso a ganar',xp:70,m:'¡A tope en la pista! 🔥'},
  {n:'Torneo',g:'2 h o más · varios partidos seguidos',xp:110,m:'¡Espíritu de campeón! 🏆'}]}
};
let ui={t:null,l:1,min:'',km:'',dd:null,md:null,wd:null,wk:null,bk:'',shErr:'',cal:null,calSel:null};
const DEF={start:null,hard:false,fails:0,tab:'hoy',
 habits:[
  {id:'h1',ic:'🥗',n:'Comer sano',a:'Nutrición',xp:20},
  {id:'h2',ic:'🏋️',n:'Entrenar',a:'Fuerza',xp:0},
  {id:'h3',ic:'👟',n:'10.000 pasos',a:'Resistencia',xp:20},
  {id:'h4',ic:'😴',n:'Dormir 7h',a:'Mente',xp:15},
  {id:'h5',ic:'💧',n:'Beber 2L de agua',a:'Nutrición',xp:10},
  {id:'h6',ic:'🍬',n:'Sin azúcar',a:'Mente',xp:15}],
 days:{},med:{},goal:null,plan:['fuerza','correr','fuerza','bici','correr','bici','descanso']};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>ymd(new Date());
const dv=(x,k)=>x?((k==='sun'||k==='read')?x[k]:(x.data&&x.data[k])):undefined;
const AUTOL={pasos:'pasos',sueno:'h de sueño'};
const f2=n=>String(Math.round(n*100)/100);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>{const x=S.days[d]||(S.days[d]={done:[],data:{}});x.work=x.work||[];return x};
const perfect=d=>{const x=S.days[d];return x&&S.habits.length>0&&S.habits.every(h=>(h.from&&d<h.from)||x.done.includes(h.id))};
const hx=h=>(h.id==='h2'||h.id==='h7'||h.id==='h8')?0:h.xp;
const sunT=()=>(S.sunT&&S.sunT.length===4)?S.sunT:[30,60,90,120];
const sunTier=m=>{const xs=[10,20,30,40],ns=['Un paseo','Buen rato','Día al aire libre','Día solar'];let r={n:'',xp:0};sunT().forEach((th,i)=>{if(m>=th)r={n:ns[i],xp:xs[i]}});return r};
const readT=()=>(S.readT&&S.readT.length===4)?S.readT:[10,20,30,60];
const readTier=m=>{const xs=[10,20,30,40],ns=['Unas páginas','Buen rato','Lector','Maratón lectora'];let r={n:'',xp:0};readT().forEach((th,i)=>{if(m>=th)r={n:ns[i],xp:xs[i]}});return r};
function syncRead(){const th=readT()[0];for(const d in S.days){const x=S.days[d];if(x.read==null)continue;const i=x.done.indexOf('h8');if(x.read>=th&&i<0)x.done.push('h8');if(x.read<th&&i>=0)x.done.splice(i,1)}}
function syncSun(){const th=sunT()[0];for(const d in S.days){const x=S.days[d];if(x.sun==null)continue;const i=x.done.indexOf('h7');if(x.sun>=th&&i<0)x.done.push('h7');if(x.sun<th&&i>=0)x.done.splice(i,1)}}
const dayXP=d=>{const x=S.days[d];if(!x)return 0;let t=0;S.habits.forEach(h=>{if(x.done.includes(h.id))t+=hx(h)});if(perfect(d))t+=25;(x.work||[]).forEach(w=>{t+=WK[w.t].lv[w.l].xp});t+=sunTier(x.sun||0).xp;t+=readTier(x.read||0).xp;return t};
const totalXP=()=>Object.keys(S.days).reduce((a,d)=>a+dayXP(d),0)+allWeeks().reduce((a,m)=>a+weekBonus(m),0);
const lvl=xp=>Math.floor(Math.sqrt(xp/60))+1;
const lvlStart=l=>60*(l-1)**2;
const RANKS=[[1,'Bronce','🥉','#cd8b4a'],[5,'Plata','🥈','#8b97b0'],[10,'Oro','🥇','#e0a800'],[15,'Platino','💠','#2bb5e0'],[20,'Diamante','💎','#5b7bff'],[25,'Leyenda','👑','#ff5fa8']];
const rank=l=>{let r=RANKS[0];RANKS.forEach(z=>{if(l>=z[0])r=z});return{min:r[0],n:r[1],ic:r[2],col:r[3]}};
const nextRank=l=>RANKS.find(z=>z[0]>l);
const lvMsg=(b,a)=>rank(a).n!==rank(b).n?'🏅 ¡Nuevo rango: '+rank(a).ic+' '+rank(a).n+'!':'🎉 ¡Nivel '+a+'!';
function streak(){let t=today(),n=0,d=perfect(t)?t:addD(t,-1);while(perfect(d)&&diff(S.start||t,d)>=0){n++;d=addD(d,-1)}return n}
function checkHard(){
 if(!S.start){return}
 if(S.hard){const t=today();for(let d=S.start;diff(d,t)>0;d=addD(d,1)){if(!perfect(d)){S.fails++;S.start=t;S.lost=d;save();return}}}
}
function attrXP(a){let t=0;for(const d in S.days){const x=S.days[d];if(a==='Mente')t+=sunTier(x.sun||0).xp+readTier(x.read||0).xp;S.habits.forEach(h=>{if(h.a===a&&x.done.includes(h.id))t+=hx(h)});(x.work||[]).forEach(w=>{const q=WK[w.t],f=q.at[a];if(f)t+=Math.round(q.lv[w.l].xp*f)})}return t}
function weekDays(){const n=new Date();const w=(n.getDay()+6)%7;const m=addD(today(),-w);return Array.from({length:7},(_,i)=>addD(m,i))}
function badges(){const nw=Object.values(S.days).reduce((a,x)=>a+(x.work||[]).length,0),st=streak(),l=lvl(totalXP()),nd=Object.keys(S.days).filter(perfect).length,wl=allWeeks().map(chOf),nc=wl.reduce((a,L)=>a+L.filter(c=>c.done).length,0),nf=wl.filter(L=>L.every(c=>c.done)).length;
 return[['🎯','Primer reto semanal',nc>=1],['🏅','Semana de retos completa',nf>=1],['🏆','10 retos superados',nc>=10],['🌱','Primer día perfecto',nd>=1],['🏁','Primera sesión',nw>=1],['🏃','10 sesiones',nw>=10],['🦍','Sesión Bestia',Object.values(S.days).some(x=>(x.work||[]).some(w=>w.l===3))],['🔥','Racha 3',st>=3],['⚡','Racha 7',st>=7],['🛡️','Racha 14',st>=14],['👑','Racha 30',st>=30],['🏆','66 días',st>=66],['⭐','Nivel 5',l>=5],['💎','Nivel 10',l>=10],['💪','10 días perfectos',nd>=10]]}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function toggle(id){
 const t=today(),x=day(t),before=lvl(totalXP());
 const i=x.done.indexOf(id);i<0?x.done.push(id):x.done.splice(i,1);
 if(!S.start)S.start=t;
 save();const after=lvl(totalXP());
 if(after>before)toast(lvMsg(before,after));
 else if(i<0&&perfect(t))toast('🔥 ¡Día perfecto! +25 XP');
 render();
}
function setData(k,v){day(today()).data[k]=v===''?undefined:Number(v);save()}
const DF=[['kcal','🔥','Calorías','kcal',0,10000],['pasos','👟','Pasos','pasos',0,100000],['sueno','😴','Sueño','h',0,24],['sun','☀️','Luz diurna','min',0,1000],['read','📖','Lectura','min',0,1000]];
const COL={read:'#b39dff',sun:'#ffd84a',kcal:'#ffb020',pasos:'#2ee59d',sueno:'#5cc8ff',agua:'#4aa8ff',cintura:'#ff7ab8'};
function chart(key,label,col){
 const t=today(),pts=[];for(let i=29;i>=0;i--){const d=addD(t,-i),v=dv(S.days[d],key);if(v!=null&&!isNaN(v))pts.push({i:29-i,v})}
 if(!pts.length)return`<div class="card"><b>${label}</b><div class="mut" style="margin-top:4px">Sin datos en los últimos 30 días</div></div>`;
 const ys=pts.map(p=>p.v);let mn=Math.min(...ys),mx=Math.max(...ys);const pd=Math.max((mx-mn)*.15,mx*.02,.5);mn-=pd;mx+=pd;
 const avg=ys.reduce((a,b)=>a+b,0)/ys.length,lp=pts[pts.length-1];
 const X=i=>34+i*(274/29),Y=v=>108-(v-mn)/(mx-mn)*92,fmt=d=>d.slice(8)+'/'+d.slice(5,7),r=v=>Math.abs(v)>=100?Math.round(v):Math.round(v*100)/100;
 return`<div class="card"><div class="row"><b>${label}</b><span class="sp"></span><span class="mut">media ${r(avg)} · ${pts.length} día${pts.length>1?'s':''}</span></div>
 <svg viewBox="0 0 320 135" width="100%">${[0,1,2].map(k=>{const v=mn+(mx-mn)*k/2;return`<line x1="34" x2="310" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="30" y="${Y(v)+3}" text-anchor="end">${r(v)}</text>`}).join('')}
 <polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>
 ${pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.5" fill="${col}"/>`).join('')}
 <text x="${Math.min(X(lp.i),300)}" y="${Y(lp.v)-8}" text-anchor="middle" style="fill:var(--tx);font-weight:700">${r(lp.v)}</text>
 ${[0,14,29].map(i=>`<text x="${X(i)}" y="128" text-anchor="middle">${fmt(addD(t,i-29))}</text>`).join('')}</svg></div>`}

function applySun(x,v){const th=sunT()[0];if(v==null||isNaN(v))delete x.sun;else x.sun=Math.round(v);
 const i=x.done.indexOf('h7'),ok=x.sun!=null&&x.sun>=th;let nw=false;
 if(ok&&i<0){x.done.push('h7');nw=true}if(!ok&&i>=0)x.done.splice(i,1);return nw}
function applyRead(x,v){const th=readT()[0];if(v==null||isNaN(v))delete x.read;else x.read=Math.round(v);
 const i=x.done.indexOf('h8'),ok=x.read!=null&&x.read>=th;let nw=false;
 if(ok&&i<0){x.done.push('h8');nw=true}if(!ok&&i>=0)x.done.splice(i,1);return nw}
function saveD(){
 const d=document.getElementById('dd').value||today(),vals={};
 for(const[k,ic,n,u,mn,mx] of DF){const raw=String(document.getElementById('d_'+k).value).trim().replace(',','.');
  if(raw===''){vals[k]=null;continue}
  const v=parseFloat(raw);
  if(isNaN(v)||v<mn||v>mx){alert(n+': introduce un valor válido ('+mn+' a '+mx+' '+u+')');return}
  vals[k]=v}
 const x=day(d),b=lvl(totalXP()),newly=[];
 for(const k in vals){if(k==='sun'){if(applySun(x,vals[k])){const hh=S.habits.find(h=>h.id==='h7');newly.push(hh?hh.n:'Sol')}}
  else if(k==='read'){if(applyRead(x,vals[k])){const hh=S.habits.find(h=>h.id==='h8');newly.push(hh?hh.n:'Leer')}}
  else if(vals[k]===null)delete x.data[k];else x.data[k]=vals[k]}
 S.habits.forEach(h=>{if(!h.auto)return;const v=vals[h.auto.k];if(v==null)return;const i=x.done.indexOf(h.id),ok=autoOk(h,v);
  if(ok&&i<0){x.done.push(h.id);newly.push(h.n)}if(!ok&&i>=0)x.done.splice(i,1)});
 ui.dd=d;save();const a=lvl(totalXP());
 toast(a>b?lvMsg(b,a):'Datos guardados ✅'+(newly.length?' · ✔ '+newly.join(', '):''));render()}
const autoOk=(h,v)=>v>=h.auto.min&&(h.auto.max==null||v<=h.auto.max);
function setAuto(i,k){const h=S.habits[i];if(!k)delete h.auto;else if(k==='kcal')h.auto={k,min:2500,max:3300};else h.auto={k,min:(h.auto&&h.auto.k===k)?h.auto.min:(k==='pasos'?10000:7)};save();render()}
function setAutoMax(i,v){const h=S.habits[i],n=parseFloat(String(v).replace(',','.'));if(h.auto&&!isNaN(n)&&n>0){h.auto.max=n;save()}render()}
function setAutoMin(i,v){const h=S.habits[i],n=parseFloat(String(v).replace(',','.'));if(h.auto&&!isNaN(n)&&n>0){h.auto.min=n;save()}render()}

function vHoy(){
 const t=today(),x=day(t),xp=totalXP(),l=lvl(xp),a=lvlStart(l),b=lvlStart(l+1),pct=Math.round((xp-a)/(b-a)*100),R=rank(l),NR=nextRank(l);
 const dn=S.start?Math.min(66,diff(S.start,t)+1):0,st=streak();
 const wk=weekDays().filter(d=>d<=t&&perfect(d)).length;

 let g='';for(let i=0;i<66;i++){const d=S.start?addD(S.start,i):null;let c='';if(d){if(perfect(d))c='ok';else if(d<t)c='bad';if(d===t)c+=' today'}g+=`<i class="${c}"></i>`}

function addLines(){
 const a=document.getElementById('al'),txt=String((a&&a.value)||'').trim();
 if(!txt){alert('Pega primero las líneas de texto');return}
 let n=0,bad=0,newly=[];const b=lvl(totalXP());
 txt.split(/\r?\n/).forEach(L=>{L=L.trim();if(!L)return;
  const p=L.split('|').map(z=>z.trim());
  if(p[0]!=='R66'||!/^\d{4}-\d{2}-\d{2}$/.test(p[1]||'')){bad++;return}
  const d=p[1],x=day(d),vals={},wk=[],md={};
  p.slice(2).forEach(t=>{if(!t)return;
   if(t.includes('=')){const[k,v]=t.split('='),f=parseFloat(String(v).replace(',','.'));if(isNaN(f))return;
    if(k==='peso'||k==='kcal'||k==='pasos'||k==='sueno'||k==='sun'||k==='read')vals[k]=f;
    else if(MF.some(m=>m[0]===k))md[k]=f}
   else{const q=t.split(',');if(WK[q[0]]){const l=Math.max(0,Math.min(3,parseInt(q[1])||0));wk.push({id:Date.parse(d)+wk.length+1,t:q[0],l,min:+q[2]||0,km:+q[3]||0,src:'line'})}}});
  for(const k in vals){if(k==='sun'){if(applySun(x,vals[k]))newly.push('Sol')}
   else if(k==='read'){if(applyRead(x,vals[k]))newly.push('Leer')}
   else x.data[k]=vals[k]}
  S.habits.forEach(h=>{if(!h.auto)return;const v=vals[h.auto.k];if(v==null)return;const i=x.done.indexOf(h.id),ok=autoOk(h,v);
   if(ok&&i<0){x.done.push(h.id);newly.push(h.n)}if(!ok&&i>=0)x.done.splice(i,1)});
  if(wk.length){x.work=x.work.filter(w=>w.src!=='line').concat(wk)}
  if(Object.keys(md).length){S.med=S.med||{};S.med[d]=Object.assign(S.med[d]||{},md)}
  n++});
 save();const c=lvl(totalXP());
 if(a)a.value='';
 toast(n?(c>b?lvMsg(b,c):n+' día(s) añadidos ✅')+(bad?' · '+bad+' línea(s) no válidas':''):'Ninguna línea válida ⚠️');render()}

 {id:'perf5',ic:'🔥',t:'Consigue 5 días perfectos',g:5,xp:60,f:D=>D.filter(perfect).length},
 {id:'read5',ic:'📖',t:'Lee 5 días de la semana',g:5,xp:40,f:D=>D.filter(d=>S.days[d]&&S.days[d].done.includes('h8')).length},
 {id:'sun5',ic:'☀️',t:'Completa la misión del sol 5 días',g:5,xp:40,f:D=>D.filter(d=>S.days[d]&&S.days[d].done.includes('h7')).length},
 {id:'steps5',ic:'👟',t:'10.000 pasos en 5 días',g:5,xp:50,f:D=>D.filter(d=>(dv(S.days[d],'pasos')||0)>=10000).length},
 {id:'sleep5',ic:'😴',t:'Duerme 7 h o más 5 días',g:5,xp:40,f:D=>D.filter(d=>(dv(S.days[d],'sueno')||0)>=7).length},
 {id:'weigh5',ic:'⚖️',t:'Registra tu peso 5 días',g:5,xp:30,f:D=>D.filter(d=>dv(S.days[d],'peso')!=null).length}];
const wks=D=>D.reduce((a,d)=>a.concat((S.days[d]&&S.days[d].work)||[]),[]);
const CHB=[
 {id:'ses4',ic:'🏁',t:'Haz 4 sesiones de entrenamiento',g:4,xp:50,f:D=>wks(D).length},
 {id:'cardio2',ic:'🏃',t:'2 sesiones de cardio (correr, bici o senderismo)',g:2,xp:40,f:D=>wks(D).filter(w=>['correr','bici','senderismo'].includes(w.t)).length},
 {id:'var3',ic:'🎯',t:'Prueba 3 tipos de entrenamiento distintos',g:3,xp:60,f:D=>new Set(wks(D).map(w=>w.t)).size},
 {id:'str2',ic:'🏋️',t:'2 sesiones de fuerza',g:2,xp:40,f:D=>wks(D).filter(w=>w.t==='fuerza').length},
 {id:'km30',ic:'🧭',t:'Acumula 30 km (correr, bici o senderismo)',g:30,xp:60,f:D=>wks(D).filter(w=>['correr','bici','senderismo'].includes(w.t)).reduce((a,w)=>a+(w.km||0),0)},
 {id:'padel1',ic:'🎾',t:'Juega al pádel',g:1,xp:30,f:D=>wks(D).filter(w=>w.t==='padel').length}];
const CH_ALL=3,CH_BONUS=30;
function chOf(m){
 const idx=Math.abs(Math.round(diff('2024-01-01',m)/7)),D=Array.from({length:7},(_,i)=>addD(m,i));
 let a=(idx+7)*9301+49297;const rnd=()=>{a=(a*9301+49297)%233280;return a/233280};
 const pa=CHA[Math.floor(rnd()*CHA.length)],pb=CHB[Math.floor(rnd()*CHB.length)],rest=CHA.concat(CHB).filter(c=>c!==pa&&c!==pb),pc=rest[Math.floor(rnd()*rest.length)];
 return[pa,pb,pc].map(c=>{const cur=c.f(D);return Object.assign({},c,{cur,done:cur>=c.g})})}
function weekBonus(m){const L=chOf(m);let b=L.filter(c=>c.done).reduce((a,c)=>a+c.xp,0);if(L.every(c=>c.done))b+=CH_BONUS;return b}
const allWeeks=()=>[...new Set(Object.keys(S.days).map(ws))];
const wbT=()=>allWeeks().reduce((a,m)=>a+weekBonus(m),0);
function chCard(m,title){
 const L=chOf(m),n=L.filter(c=>c.done).length,full=n===L.length,fx=v=>f2(Math.min(v.cur,v.g));
 return`<div class="card"><div class="row"><b>${title}</b><span class="sp"></span><span class="pill">${n}/${L.length}${full?' ✅':''}</span></div>
 ${L.map(c=>`<div style="margin-top:12px"><div class="row"><span style="font-size:20px">${c.ic}</span><div class="sp" style="${c.done?'color:var(--ok);':''}font-weight:600">${c.t}</div><span class="pill" style="${c.done?'background:var(--ok);color:#06241b;font-weight:700':''}">${c.done?'✓ ':''}+${c.xp} XP</span></div>
 <div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,c.cur/c.g*100)}%;${c.done?'background:var(--ok)':''}"></i></div><div class="mut" style="font-size:12px;margin-top:3px">${fx(c)} / ${c.g}</div></div>`).join('')}
 <div class="mut" style="margin-top:12px;font-size:12px">${full?'🎉 ¡Semana de retos completa! Bonus +'+CH_BONUS+' XP incluido':'Completa los '+L.length+' y gana +'+CH_BONUS+' XP extra'} · XP de retos esta semana: <b style="color:var(--tx)">${weekBonus(m)}</b></div></div>`}
function chNotify(){
 const w=ws(today()),ids=chOf(w).filter(c=>c.done).map(c=>c.id),sn=S.chSeen;
 if(sn&&sn.w===w){const nw=chOf(w).filter(c=>c.done&&!sn.ids.includes(c.id));
  if(nw.length){const full=ids.length===CH_ALL;setTimeout(()=>toast('🎯 Reto completado: '+nw[0].t.toLowerCase()+' · +'+nw.reduce((a,c)=>a+c.xp,0)+(full?' +'+CH_BONUS:'')+' XP'),1900)}}
 if(!sn||sn.w!==w||sn.ids.join()!==ids.join()){S.chSeen={w,ids};save()}}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function vCal(){
 const t=today(),cm=t.slice(0,8)+'01',m=(ui.cal&&ui.cal<=cm)?ui.cal:cm,y=+m.slice(0,4),mo=+m.slice(5,7),
 nd=new Date(y,mo,0).getDate(),off=(new Date(y,mo-1,1).getDay()+6)%7,
 prevM=ymd(new Date(y,mo-2,1)),nextM=ymd(new Date(y,mo,1)),isCur=m>=cm,sel=ui.calSel||(isCur?t:null);
 let cells='',perf=0,act=0,ses=0,xp=0,days=0;
 for(let i=0;i<off;i++)cells+='<i></i>';
 for(let n=1;n<=nd;n++){
  const d=m.slice(0,8)+pad(n),x=S.days[d],fut=d>t,hs=S.habits.filter(h=>!(h.from&&d<h.from)),
  c=x?x.done.filter(id=>hs.some(h=>h.id===id)).length:0,p=perfect(d),w=(x&&x.work)||[],ratio=hs.length?c/hs.length:0;
  if(!fut){days++;xp+=dayXP(d);ses+=w.length;if(p)perf++;if(c>0||w.length)act++}
  const missed=!fut&&d!==t&&S.start&&d>=S.start&&!c&&!w.length;
  let bg='var(--track)';if(p)bg='var(--ok)';else if(ratio>0)bg='rgba(46,229,157,'+(0.15+ratio*0.35).toFixed(2)+')';else if(missed)bg='rgba(255,92,122,.18)';
  const icons=[...new Set(w.map(s=>WK[s.t]?WK[s.t].ic:''))].slice(0,2).join('');
  cells+=`<button class="calc${d===t?' tod':''}${d===sel?' sel':''}" style="background:${bg};${p?'color:#06241b;':''}${fut?'opacity:.3':''}" ${fut?'disabled':''} onclick="ui.calSel='${d}';render()"><span class="cn">${n}</span><span class="ci">${icons}</span></button>`}
 const tile=(l,v)=>`<div style="background:var(--card2);border-radius:12px;padding:8px;text-align:center"><div style="font-size:18px;font-weight:800">${v}</div><div class="mut" style="font-size:11px">${l}</div></div>`;
 return`<div class="card"><div class="row" style="gap:8px"><button class="b s" style="margin:0;width:52px;flex:none" onclick="ui.cal='${prevM}';ui.calSel=null;render()">◀</button>
 <div class="sp" style="text-align:center;font-weight:700;text-transform:capitalize">${MESES[mo-1]} ${y}</div>
 <button class="b s" style="margin:0;width:52px;flex:none;${isCur?'opacity:.3':''}" ${isCur?'disabled':''} onclick="ui.cal='${nextM}';ui.calSel=null;render()">▶</button></div>
 <div class="calg" style="margin-top:10px">${'LMXJVSD'.split('').map(l=>`<div class="calh">${l}</div>`).join('')}${cells}</div>
 <div class="mut" style="margin-top:10px;font-size:12px;line-height:1.8"><span style="color:var(--ok)">■</span> día perfecto &nbsp;<span style="color:#6fcf9f">■</span> parcial &nbsp;<span style="color:var(--bad)">■</span> sin actividad &nbsp;🏋️🏃🚴🥾🎾 entreno</div>
 <div class="g2" style="margin-top:10px;grid-template-columns:repeat(4,minmax(0,1fr))">${tile('perfectos',perf+'/'+days)}${tile('activos',act+'/'+days)}${tile('sesiones',ses)}${tile('XP',xp)}</div></div>
 ${sel&&sel.slice(0,7)===m.slice(0,7)?calDetail(sel):'<div class="card mut">Toca un día para ver su detalle</div>'}`}
function calDetail(d){
 const x=S.days[d]||{done:[],data:{},work:[]},hs=S.habits.filter(h=>!(h.from&&d<h.from)),w=x.work||[],dd=x.data||{},p=perfect(d),dat=[];
 [['peso','⚖️','kg'],['pasos','👟',''],['sueno','😴','h'],['kcal','🔥','kcal']].forEach(a=>{if(dd[a[0]]!=null)dat.push(a[1]+' '+dd[a[0]]+(a[2]?' '+a[2]:''))});
 if(x.sun!=null)dat.push('☀️ '+x.sun+' min');if(x.read!=null)dat.push('📖 '+x.read+' min');
 const me=S.med&&S.med[d],meT=me?MF.filter(f=>me[f[0]]!=null).map(f=>f[1]+' '+me[f[0]]).join(' · '):'';
 return`<div class="card"><div class="row"><b style="text-transform:capitalize">${WD[parse(d).getDay()]} ${d.slice(8)}/${d.slice(5,7)}/${d.slice(0,4)}</b><span class="sp"></span><span class="pill">${dayXP(d)} XP${p?' · ✅ perfecto':''}</span></div>
 <div style="margin-top:10px">${hs.map(h=>`<div style="padding:3px 0;${x.done.includes(h.id)?'':'opacity:.5'}">${x.done.includes(h.id)?'✅':'⬜'} ${esc(h.ic)} ${esc(h.n)}</div>`).join('')||'<div class="mut">Sin misiones</div>'}</div>
 ${w.length?`<div style="margin-top:10px"><b>Entrenos</b>${w.map(s=>{const q=WK[s.t];return q?`<div class="mut" style="padding:3px 0">${q.ic} ${q.n} · ${q.lv[s.l].n}${s.min?' · '+s.min+' min':''}${s.km?' · '+s.km+' km':''} · +${q.lv[s.l].xp} XP</div>`:''}).join('')}</div>`:''}
 ${dat.length?`<div class="mut" style="margin-top:10px;line-height:1.8">${dat.join(' &nbsp;·&nbsp; ')}</div>`:''}
 ${meT?`<div class="mut" style="margin-top:6px">📏 ${meT}</div>`:''}
 <div class="g2" style="margin-top:12px"><button class="b s" style="margin:0" onclick="ui.wd='${d}';ui.dd=null;S.tab='entreno';save();render();scrollTo(0,0)">🏋️ Entreno de este día</button><button class="b s" style="margin:0" onclick="ui.dd='${d}';ui.wd=null;S.tab='datos';save();render();scrollTo(0,0)">📊 Datos de este día</button></div></div>`}
const THEMES=[['bevel','🌑','Oscuro'],['claro','☀️','Claro'],['clasico','🎮','Clásico']];
const curTheme=()=>THEMES.some(t=>t[0]===S.theme)?S.theme:'bevel';
function applyTheme(){try{const th=curTheme();document.documentElement.setAttribute('data-theme',th);
 const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',{bevel:'#000000',claro:'#f2f2f7',clasico:'#0f1020'}[th])}catch(e){}}
function setTheme(k){S.theme=k;save();applyTheme();render()}
function vTema(){return`<div class="card"><label>🎨 Tema de la app</label><div class="row" style="gap:8px">${THEMES.map(t=>`<button class="tp ${curTheme()===t[0]?'on':''}" style="--c:var(--ac);padding:10px 4px" onclick="setTheme('${t[0]}')"><span style="font-size:22px">${t[1]}</span><br>${t[2]}</button>`).join('')}</div></div>`}
function sunCard(h,x){const m=x.sun||0,q=sunTier(m),th=sunT(),ok=m>=th[0];
 return`<div class="card" style="border:2px solid ${ok?'var(--ok)':'transparent'};${ok?'background:var(--okbg)':''}"><div class="row"><span class="ic" style="font-size:26px">${esc(h.ic)}</span><div class="sp"><b>${esc(h.n)}</b><div class="mut">${m?m+' min · '+(ok?q.n+' +'+q.xp+' XP':'mínimo '+th[0]+' min'):'Mente · '+th.join(' / ')+' min = +10 / +20 / +30 / +40 XP'}</div></div><span class="chk" style="${ok?'background:var(--ok);border-color:var(--ok);color:#06241b':''}">${ok?'✓':''}</span></div>
 <div class="row" style="margin-top:10px;gap:8px"><input id="sunm" type="text" inputmode="numeric" placeholder="minutos de luz diurna" value="${m||''}" style="flex:1"><button class="b" style="margin:0;flex:1" onclick="saveSun()">Registrar</button></div>
 <div class="mut" style="margin-top:6px;font-size:12px">Pon el tiempo de luz diurna que marca Salud (Apple Watch). Con más de ${th[3]} min no suma más XP. Los niveles se ajustan en Perfil.</div>
 <button class="b s" style="margin-top:8px;padding:8px" onclick="ui.dd=addD(today(),-1);go('datos')">¿Se te pasó ayer? Regístralo en otro día ›</button></div>`}
function saveSun(){
 const raw=String(document.getElementById('sunm').value).trim().replace(',','.'),v=raw===''?0:parseFloat(raw);
 if(isNaN(v)||v<0||v>1000){alert('Introduce los minutos de luz (0 a 1000)');return}
 const t=today(),x=day(t),xp0=totalXP(),wb0=wbT(),b=lvl(xp0),th0=sunT()[0];
 x.sun=Math.round(v);const i=x.done.indexOf('h7');
 if(x.sun>=th0&&i<0)x.done.push('h7');
 if(x.sun<th0&&i>=0)x.done.splice(i,1);
 if(!S.start)S.start=t;save();
 const g=totalXP()-xp0-(wbT()-wb0),a=lvl(totalXP());
 toast(a>b?lvMsg(b,a):g>0?'☀️ '+sunTier(x.sun).n+' +'+g+' XP':x.sun>=th0?'☀️ Sol registrado':'☀️ Registrado ('+x.sun+' min)');
 render()}
function saveSunCfg(){
 const v=[0,1,2,3].map(i=>parseInt(String(document.getElementById('st'+i).value).trim(),10));
 if(v.some(n=>isNaN(n)||n<1||n>1000)||v.some((n,i)=>i&&n<=v[i-1])){alert('Escribe 4 números enteros, cada uno mayor que el anterior');return}
 S.sunT=v;syncSun();save();toast('Niveles guardados ☀️');render()}
async function cpy(){const j=bkJson();try{await navigator.clipboard.writeText(j);markBk();toast('Copiado 📋 Pégalo en Notas');render()}catch(e){ui.bk=j;render();const a=document.getElementById('bk');if(a){a.focus();a.select();try{a.setSelectionRange(0,j.length)}catch(_){}}toast('Selecciona todo el texto del cuadro y cópialo')}}
function impTxt(){const a=document.getElementById('bk'),j=String((a&&a.value)||ui.bk||'').trim();if(!j){alert('Primero pega el texto de tu copia en el cuadro');return}
 try{const o=JSON.parse(j);if(!o||typeof o!=='object'||!o.days)throw 0;S=Object.assign(structuredClone(DEF),o);ui.bk='';save();render();toast('Datos importados ✅')}catch(e){alert('El texto no es una copia válida. Asegúrate de copiarlo entero.')}}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.days)throw 0;S=Object.assign(structuredClone(DEF),o);save();render();toast('Datos importados ✅')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}

function render(){
 const sc=window.scrollY;
 const V={hoy:vHoy,entreno:vEntreno,peso:vPeso,medidas:vMedidas,datos:vDatos,perfil:()=>vPerfil()+vAjustes()};
 document.getElementById('app').innerHTML=(V[S.tab]||vHoy)();
 const T=[['hoy','🎯','Hoy'],['entreno','🏋️','Entreno'],['peso','⚖️','Peso'],['medidas','📏','Medidas'],['datos','📊','Datos'],['perfil','🏅','Perfil']];
 document.getElementById('nav').innerHTML=T.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="ui.wd=null;ui.wk=null;ui.cal=null;ui.calSel=null;S.tab='${t[0]}';save();render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join('');
 scrollTo(0,sc);
 chNotify();
}
applyTheme();
S.habits.forEach(h=>{if(!ATTRS.includes(h.a))h.a='Resistencia'});
if(!S.sunAdded){if(!S.habits.some(h=>h.id==='h7'))S.habits.push({id:'h7',ic:'☀️',n:'Tomar el sol',a:'Mente',xp:0,from:today()});S.sunAdded=true;save()}
if(!S.readAdded){if(!S.habits.some(h=>h.id==='h8'))S.habits.push({id:'h8',ic:'📖',n:'Leer',a:'Mente',xp:0,from:today()});S.readAdded=true;save()}
if(!S.kcalAdded){const a=S.habits.find(h=>h.id==='h1');if(a&&!a.auto&&a.n==='Comer sano')a.auto={k:'kcal',min:2500,max:3300};S.kcalAdded=true;save()}
if(!S.autoAdded){const a=S.habits.find(h=>h.id==='h3'),b=S.habits.find(h=>h.id==='h4');if(a&&!a.auto&&a.n==='10.000 pasos')a.auto={k:'pasos',min:10000};if(b&&!b.auto&&b.n==='Dormir 7h')b.auto={k:'sueno',min:7};S.autoAdded=true;save()}
S.med=S.med||{};for(const d in S.days){const y=S.days[d].data;if(y&&y.cintura!=null){const o=S.med[d]=S.med[d]||{};if(o.cintura==null)o.cintura=y.cintura;delete y.cintura}}
syncSun();syncRead();for(const d in S.days)delete S.days[d].pages;save();
checkHard();render();
</script>
